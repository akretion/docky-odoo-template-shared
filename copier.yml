_message_after_copy: |
  {% if kpiten %}
  KpiTen (dashboards on the data of Odoo) : to finish
    - copy the content of odoo/spec-kpiten.yaml in odoo/spec.yaml, then delete it
    - Odoo 18 and more : add git+https://github.com/akretion/kpiten.git@kpiten-core to
      odoo/requirements.txt (the structural validation of the tiles ; the older series go without)
    - docky build, docky up, then install the modules kpiten, kpiten_data and the fronts you want
      (kpiten_shiny, kpiten_nicegui, kpiten_marimo)
    - the address of the fronts is set by `odoo neutralize` : after `sh load_db`, or by hand on the
      current database : docky run odoo neutralize
  {% endif %}
